<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
    <title>Desbloquear Agentic</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #e6e6e6;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 48px 44px 28px;
        box-sizing: border-box;
        text-align: center;
        -webkit-app-region: drag;
      }
      .logo {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 8px 24px rgb(167 139 250 / 0.25));
      }
      h1 {
        margin: 6px 0 0;
        font-size: 21px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #8a8a8a;
      }
      .error {
        min-height: 20px;
        color: #ff6b6b;
        font-size: 13px;
      }
      form,
      .view {
        display: none;
        width: 100%;
        flex-direction: column;
        gap: 10px;
        -webkit-app-region: no-drag;
      }
      body[data-state="setup"] #setup-form,
      body[data-state="password"] #password-form,
      body[data-state="touchid"] #touch-view {
        display: flex;
      }
      .finger {
        width: 56px;
        height: 56px;
        margin: 8px auto;
        color: #ff6b6b;
      }
      input {
        height: 42px;
        padding: 0 14px;
        border-radius: 9px;
        border: 1px solid #363636;
        background: #070707;
        color: #e6e6e6;
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: #7aa7ff;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
      button {
        height: 40px;
        padding: 0 16px;
        border-radius: 9px;
        border: 1px solid #363636;
        background: #161616;
        color: #e6e6e6;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #e6e6e6;
        border-color: #e6e6e6;
        color: #0a0a0a;
        font-weight: 500;
      }
      button.link {
        border: 0;
        background: none;
        color: #8a8a8a;
        height: auto;
        padding: 4px;
        font-size: 13px;
      }
      button:disabled,
      input:disabled {
        opacity: 0.5;
      }
      button:focus-visible {
        outline: 2px solid #7aa7ff;
        outline-offset: 2px;
      }
    </style>
    <script src="lock.js" defer></script>
  </head>
  <body data-state="">
    <svg class="logo" viewBox="100 100 824 824" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="276" y1="0" x2="748" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f2f2f2" /><stop offset=".55" stop-color="#a78bfa" /><stop offset="1" stop-color="#ff8a5b" /></linearGradient>
      </defs>
      <path d="M512 100c228 0 300 0 356 56s56 128 56 356 0 300-56 356-128 56-356 56-300 0-356-56-56-128-56-356 0-300 56-356 128-56 356-56z" fill="#000" stroke="#fff" stroke-opacity=".16" stroke-width="10" />
      <path fill="url(#g)" fill-rule="evenodd" d="M276 774 470 250H554L748 774H684L630.7 630H393.3L340 774ZM512 309.4 615.9 590H408.1Z" />
    </svg>
    <h1 id="title">Agentic</h1>
    <p id="hint"></p>

    <form id="setup-form" autocomplete="off">
      <input id="new1" type="password" placeholder="Nueva contraseña (mín. 8)" minlength="8" required aria-label="Nueva contraseña" />
      <input id="new2" type="password" placeholder="Repite la contraseña" minlength="8" required aria-label="Repite la contraseña" />
      <div class="row">
        <button type="button" data-quit>Salir</button>
        <button type="submit" class="primary">Crear contraseña</button>
      </div>
    </form>

    <form id="password-form" autocomplete="off">
      <input id="pw" type="password" placeholder="Contraseña" required aria-label="Contraseña" />
      <div class="row">
        <button type="button" data-quit>Salir</button>
        <button type="submit" class="primary">Desbloquear</button>
      </div>
      <button type="button" id="use-touch" class="link" hidden>Usar Touch ID</button>
    </form>

    <div id="touch-view" class="view">
      <svg class="finger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4" />
        <path d="M14 13.12c0 2.38 0 6.38-1 8.88" />
        <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02" />
        <path d="M2 12a10 10 0 0 1 18-6" />
        <path d="M2 16h.01" />
        <path d="M21.8 16c.2-2 .131-5.354 0-6" />
        <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2" />
        <path d="M8.65 22c.21-.66.45-1.32.57-2" />
        <path d="M9 6.8a6 6 0 0 1 9 5.2v2" />
      </svg>
      <button type="button" id="use-password" class="link">Usar contraseña</button>
    </div>

    <p id="error" class="error" role="alert"></p>
  </body>
</html>
