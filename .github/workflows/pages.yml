name: Pages

# Publishes the static download page in site/ to the gh-pages branch of the
# public releases repository (this repository is private). Needs the
# RELEASES_TOKEN secret; that repository serves Pages from gh-pages.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Push site/ to gh-pages
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'perita23/agentic-releases' }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::notice::RELEASES_TOKEN is not set; nothing to deploy."
            exit 0
          fi
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy download page from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          auth=$(printf 'x-access-token:%s' "$RELEASES_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push --force --quiet "https://github.com/${RELEASES_REPO}.git" gh-pages
          echo "Deployed to https://${RELEASES_REPO%%/*}.github.io/${RELEASES_REPO#*/}/"
