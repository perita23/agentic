name: Release

# A version is "stable" when CI passes on main. Then, if package.json carries a
# version that has no release yet, tag it and publish a GitHub Release whose
# notes come from CHANGELOG.md. Re-runs are idempotent.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to release (default: main). Older versions are not marked as latest."
        required: false
      desktop_only:
        description: "Rebuild and re-attach the macOS app to an existing release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      created: ${{ steps.exists.outputs.skip != 'true' }}
      tag: ${{ steps.t.outputs.tag }}
      sha: ${{ steps.t.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and target commit
        id: t
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "${RUN_SHA:-}" ]; then sha="$RUN_SHA"; else sha=$(git rev-parse --verify "${INPUT_REF:-origin/main}^{commit}"); fi
          version=$(git show "$sha:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid version: $version"; exit 1; }
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether it is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from CHANGELOG.md
        if: steps.exists.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.t.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Versión $VERSION." > notes.md; fi
          cat notes.md

      - name: Create tag and release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
          SHA: ${{ steps.t.outputs.sha }}
          LATEST: ${{ github.event_name == 'workflow_run' }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Agentic Console $TAG" --notes-file notes.md --latest="$LATEST"

  desktop:
    name: Attach macOS app to the release
    needs: release
    if: needs.release.outputs.created == 'true' || inputs.desktop_only
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-desktop
        env:
          # Public client id for GitHub's device flow ("Conectar con GitHub" = one login).
          AGENTIC_GITHUB_CLIENT_ID: ${{ secrets.AGENTIC_GITHUB_CLIENT_ID }}
          # Builds with this public key only accept signed updates.
          AGENTIC_UPDATE_PUBLIC_KEY: ${{ vars.AGENTIC_UPDATE_PUBLIC_KEY }}
      # Integrity: sign the update manifest (it pins every zip's SHA-512), publish
      # SHA-256 checksums of every file and a CycloneDX SBOM of the app.
      - name: Sign update manifest, checksums and SBOM
        env:
          AGENTIC_UPDATE_PRIVATE_KEY: ${{ secrets.AGENTIC_UPDATE_PRIVATE_KEY }}
          AGENTIC_UPDATE_PUBLIC_KEY: ${{ vars.AGENTIC_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          node scripts/sign-update.mjs desktop/dist
          npm sbom --omit=dev --sbom-format cyclonedx > desktop/dist/agentic-sbom.cdx.json
      - name: Upload dmg, zip and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          cd desktop/dist
          # Stable names so .../releases/latest/download/Agentic-<arch>.dmg always
          # points at the newest build (used by the download page).
          arm=$(ls *.dmg | grep arm64 | head -n1)
          x64=$(ls *.dmg | grep -v arm64 | head -n1)
          cp "$arm" Agentic-arm64.dmg
          cp "$x64" Agentic-x64.dmg
          shasum -a 256 *.dmg *.zip latest-mac.yml > SHA256SUMS.txt
          gh release upload "$TAG" *.dmg *.zip latest-mac.yml $(ls latest-mac.yml.sig 2>/dev/null) SHA256SUMS.txt agentic-sbom.cdx.json --repo "$GITHUB_REPOSITORY" --clobber

      # The source repository is private, so its release assets need a GitHub
      # login. Mirror the release to a public repository for the download page
      # and for in-app updates. Needs the RELEASES_TOKEN secret (fine-grained
      # token with Contents: read and write on that repository only).
      - name: Publish to the public releases repository
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'perita23/agentic-releases' }}
          TAG: ${{ needs.release.outputs.tag }}
          LATEST: ${{ !inputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::notice::RELEASES_TOKEN is not set; skipping the public releases repository."
            exit 0
          fi
          cd desktop/dist
          GH_TOKEN="$SOURCE_TOKEN" gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          export GH_TOKEN="$RELEASES_TOKEN"
          if ! gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$RELEASES_REPO" --title "Agentic $TAG" --notes-file notes.md --latest="$LATEST"
          fi
          gh release upload "$TAG" *.dmg *.zip latest-mac.yml $(ls latest-mac.yml.sig 2>/dev/null) SHA256SUMS.txt --repo "$RELEASES_REPO" --clobber
