name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests, build & E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build

      # The browser is cached between runs, so most of the time nothing is downloaded.
      - name: Cache Chromium for the smoke test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.63.0-${{ runner.os }}

      - name: Install Chromium for the smoke test
        timeout-minutes: 15
        run: |
          npm install --no-save playwright@1.63.0
          # The download and the apt mirrors sometimes stall for many minutes without failing: each try is cut at
          # 4 minutes and repeated (a stalled connection is usually fine on the next one).
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Chromium install attempt $attempt failed or timed out"
            sleep 5
          done
          exit 1

      - name: E2E smoke test
        run: npm run smoke -- --shots smoke-shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke-shots
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit desktop app dependencies
        run: npm audit --prefix desktop --audit-level=high
